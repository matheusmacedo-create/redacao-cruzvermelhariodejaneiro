name: Empacotar redesign

on:
  push:
    branches:
      - redesign/operacao-impacto
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar ZIP completo do projeto
        run: |
          zip -r redacao-cruzvermelhariodejaneiro-redesign.zip . \
            -x '.git/*' \
            -x '.github/workflows/package-redesign.yml'

      - name: Salvar pacote
        uses: actions/upload-artifact@v4
        with:
          name: redacao-redesign-completo
          path: redacao-cruzvermelhariodejaneiro-redesign.zip
          if-no-files-found: error
          retention-days: 1
