<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão — Palácio Virtual</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #1d1a19; font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 26rem; text-align: center; display: grid; gap: 16px; justify-items: center; }
  img { width: 220px; height: auto; }
  h1 { font-size: 1.35rem; margin: 0; }
  p { margin: 0; color: #5c5552; line-height: 1.5; }
  button { font: inherit; font-weight: 600; background: #e32219; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #1d1a19; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/images/logo-cvrj.png" alt="Cruz Vermelha Brasileira – Rio de Janeiro">
  <h1>Sem conexão com a internet</h1>
  <p>O Palácio Virtual precisa de internet para mostrar os dados. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
